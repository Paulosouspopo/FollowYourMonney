# Profil de production (SPRING_PROFILES_ACTIVE=prod), derrière le proxy HTTPS Caddy.
# Les secrets et adresses viennent des variables d'environnement (deploy/.env).

# Le cookie de session n'est envoyé qu'en HTTPS
app.auth.cookie-secure=true
# Adresse réelle du client (X-Forwarded-For posé par Caddy) : sans cela, tous les
# utilisateurs partagent l'IP du proxy et donc les mêmes limites de connexion.
server.forward-headers-strategy=native

spring.jpa.properties.hibernate.format_sql=false

# SMTP réel (port 587, STARTTLS) quand MAIL_ENABLED=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
