# Les tests passent par les vraies migrations : un écart entité/migration fait échouer le build
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
# Les tests d'authentification enchaînent les connexions depuis 127.0.0.1
app.rate-limit.enabled=false

