# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:paul123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=local

# ---------- JPA / Hibernate ----------
# Le schéma est géré par Flyway (db/migration) : Hibernate vérifie seulement
# que les entités correspondent aux tables et refuse de démarrer sinon.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Insertions groupées (reconstruction des snapshots : des centaines de lignes d'un coup)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base existante créée avant Flyway (sans historique) : considérée comme déjà en V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------- Securite / JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# Emails ayant le rôle ADMIN (/api/admin/**, refresh des cours), séparés par des virgules
app.admin.emails=${ADMIN_EMAILS:}

# ---------- APIS externes ----------

app.yahoo.base-url=https://query1.finance.yahoo.com
app.yahoo.timeout-seconds=10
app.yahoo.user-agent=Mozilla/5.0


# ---------- Logs ----------

logging.level.com.portfolio.tracker=INFO

# ---------- Scheduler ----------
asset.price.update.cron=0 0 * * * *
portfolio.history.catchup.cron=0 30 23 * * *