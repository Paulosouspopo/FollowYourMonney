# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/portfolio_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:paul123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.profiles.active=local

# ---------- JPA / Hibernate ----------
# Le schéma est géré par Flyway (db/migration) : Hibernate vérifie seulement
# que les entités correspondent aux tables et refuse de démarrer sinon.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Insertions groupées (reconstruction des snapshots : des centaines de lignes d'un coup)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- Docker ----------
# Les conteneurs (PostgreSQL, Mailpit) se lancent avec `docker compose up -d` :
# Spring ne les démarre pas lui-même (comportement explicite et prévisible).
spring.docker.compose.enabled=false
# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base existante créée avant Flyway (sans historique) : considérée comme déjà en V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------- Securite / JWT ----------
app.jwt.secret=${JWT_SECRET}
# Jeton d'accès court (15 min) ; la session est prolongée par le jeton de renouvellement
app.jwt.expiration=${JWT_EXPIRATION:900000}
# ---------- Sessions & comptes ----------
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
# true en production (HTTPS) : le cookie de session n'est envoyé qu'en HTTPS
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# Base des liens envoyés par email (vérification, mot de passe oublié)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.rate-limit.enabled=true
# ---------- Emails ----------
# false : les emails sont écrits dans les logs. true : envoi SMTP
# (en dev : Mailpit du compose.yaml, interface http://localhost:8025)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:FollowYourMoney <no-reply@followyourmoney.local>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Emails ayant le rôle ADMIN (/api/admin/**, refresh des cours), séparés par des virgules
app.admin.emails=${ADMIN_EMAILS:}

# ---------- APIS externes ----------

app.yahoo.base-url=https://query1.finance.yahoo.com
app.yahoo.timeout-seconds=10
app.yahoo.user-agent=Mozilla/5.0


# ---------- Logs ----------

logging.level.com.portfolio.tracker=INFO

# ---------- Scheduler ----------
asset.price.update.cron=0 0 * * * *
portfolio.history.catchup.cron=0 30 23 * * *