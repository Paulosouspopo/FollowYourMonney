services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: tracker-postgres-1
    environment:
      - 'POSTGRES_DB=portfolio_db'
      - 'POSTGRES_PASSWORD=paul123'
      - 'POSTGRES_USER=postgres'
    ports:
      # 5433 côté machine : évite tout conflit avec un PostgreSQL installé
      # localement sur 5432 (le cas sous Windows).
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Faux serveur SMTP de dev : capture tous les emails envoyés par l'app
  # (vérification d'adresse, mot de passe oublié). Interface : http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: tracker-mailpit-1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
    driver: local
