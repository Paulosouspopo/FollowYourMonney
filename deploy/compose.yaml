# Production (serveur) : PostgreSQL + API Spring + front servi par Caddy (HTTPS automatique).
# Les deux dépôts sont clonés côte à côte : ~/fym/tracker et ~/fym/tracker-ui.
#   cd ~/fym/tracker/deploy && docker compose up -d --build
# Seul Caddy est exposé (80/443) ; l'API et la base restent sur le réseau interne.
name: fym

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: fym
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      TZ: Europe/Paris
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fym -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/portfolio_db
      DB_USERNAME: fym
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      FRONTEND_URL: https://${DOMAIN:?DOMAIN manquant dans .env}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FollowYourMoney <no-reply@example.com>}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@example.com}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  web:
    build: ../../tracker-ui
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
